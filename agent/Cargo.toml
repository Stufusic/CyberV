[package]
name = "cyberv-agent"
version = "0.1.0"
edition = "2021"
authors = ["CyberV Security Team"]
description = "Device-Binding Security Agent for CyberV"
license = "Apache-2.0"


[dependencies]
# Cryptography primitives (Điều 2, 3 - Rule.md)
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde", "zeroize"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
# Mesh/IPC session crypto — rationale: đúng 2 crate PHASE1_2 plan P1-1 chỉ định;
# tái dụng "một primitive, hai nơi dùng" (NSG-2 mesh + P1-1 IPC). RustCrypto
# chính chủ, pure-Rust, zeroize đúng INV-008. Cảnh báo: cargo-machete/deny
# chưa cài trên máy dev — đã ghi rationale tại
# Docs/NETWORK_SECURITY_GRAPH_PLAN.md Phụ lục B; job CI dependency-check phải xanh.
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# Identifiers & Data structures
uuid = { version = "1.8", features = ["v4", "fast-rng", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Async runtime & Networking
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
# mDNS discovery NSG-2b (M-PLAN M-2) — rationale dependency (Phụ lục B plan
# NSG): pure-Rust, không async runtime, duy nhất 1 crate mới của M-series.
# Vai trò: quảng bá/discovery beacon Tier A (mDNS + TCP); không mang frame
# trust — peer chỉ vào Discovered, attest phải qua bắt tay chữ ký thật.
mdns-sd = "0.21"

# Windows Hardware collector
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Rpc",
    "Win32_System_TpmBaseServices",
] }

# Logging & Error handling (Điều 18, 19 - Rule.md)
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wmi = "0.18.4"

[build-dependencies]
# Shim WinRT (M-3 WiFi Direct / M-4 BLE) qua build.rs — HYBRID §1.1. `cc` ĐÃ
# có trong Cargo.lock (transitive) — không thêm crate mới vào lock.
cc = "1"

[dev-dependencies]
tempfile = "3.10"
# Client-side handshake cho ipc_session_tests (cùng crate với main deps)
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
