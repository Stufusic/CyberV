[package]
name = "cyberv-agent"
version = "0.1.0"
edition = "2021"
authors = ["CyberV Security Team"]
description = "Device-Binding Security Agent for CyberV"

[dependencies]
# Cryptography primitives (Điều 2, 3 - Rule.md)
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Identifiers & Data structures
uuid = { version = "1.8", features = ["v4", "fast-rng", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Async runtime & Networking
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# Windows Hardware collector
sysinfo = "0.30"

# OS Secure Storage (Windows DPAPI / Credential Manager - Điều 6 - Rule.md)
keyring = "3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory",
] }

# Logging & Error handling (Điều 18, 19 - Rule.md)
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wmi = "0.18.4"

[dev-dependencies]
tempfile = "3.10"
