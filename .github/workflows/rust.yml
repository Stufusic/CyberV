name: CyberV Security CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (Windows x64)
    # BẮT BUỘC: CyberV phụ thuộc vào Windows APIs (SCM, DPAPI, Named Pipe, WMI)
    runs-on: windows-latest

    steps:
      # 1. Tải mã nguồn về Runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Thiết lập Rust Toolchain bản Stable x86_64-pc-windows-msvc
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 3. Tự động Cache các Crates và bản build để CI chạy cực nhanh
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # 4. Kiểm tra cú pháp và kiểu dữ liệu toàn bộ Workspace
      - name: Cargo Check
        run: cargo check --workspace --verbose

      # 5. Chạy toàn bộ 430+ bài kiểm thử tự động của Rust Core Agent
      - name: Rust Agent - Run Tests (430+ Passing)
        run: cargo test --workspace --verbose

      # 6. Thiết lập Python môi trường
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 7. Cài đặt dependencies kiểm thử UI
      - name: Install Python UI Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PySide6

      # 8. Chạy bộ 30 bài kiểm thử UI tự động
      - name: CyberV UI - Run Tests (30 Passing)
        run: |
          $env:PYTHONPATH="."
          pytest cyberv_ui/tests -v
